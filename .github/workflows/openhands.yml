name: OpenHands AI Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  auto-fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@openhands-agent'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Run OpenHands Resolver via Docker
        run: |
          docker run --rm \
            -e GITHUB_TOKEN=${{ secrets.PAT_TOKEN }} \
            -e GITHUB_USERNAME=${{ secrets.PAT_USERNAME }} \
            -e LLM_MODEL=${{ secrets.LLM_MODEL }} \
            -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            -e LLM_BASE_URL=${{ secrets.LLM_BASE_URL }} \
            -e GITHUB_REPO=${{ github.repository }} \
            -e ISSUE_NUMBER=${{ github.event.issue.number }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            docker.all-hands.dev/all-hands-ai/openhands:main \
            python -m openhands.resolver.resolve_issue \
              --repo ${{ github.repository }} \
              --issue-number ${{ github.event.issue.number }}