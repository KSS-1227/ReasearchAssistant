name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ https://api.render.com/deploy/srv-d8iluvbtqb8s73bajc00?key=IeHSwwQGDIY }}"

      - name: Wait for deploy to complete
        run: sleep 90

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://reasearchassistant.onrender.com)
          echo "Status code: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
          echo "App is live!"