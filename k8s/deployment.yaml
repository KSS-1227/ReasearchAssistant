apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-assistant
  labels:
    app: research-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research-assistant
  template:
    metadata:
      labels:
        app: research-assistant
    spec:
      containers:
        - name: research-assistant
          image: research-assistant:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: research-assistant-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5