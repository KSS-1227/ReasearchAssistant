apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-assistant
  labels:
    app: research-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research-assistant
  template:
    metadata:
      labels:
        app: research-assistant
    spec:
      containers:
        - name: research-assistant
          image: research-assistant:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
              name: streamlit
            - containerPort: 8000
              name: api
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: research-assistant-secrets
                  key: GEMINI_API_KEY
            - name: API_BASE_URL
              value: "http://localhost:8000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"        # ✅ increased — supports both services
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000           # ✅ check FastAPI health
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3